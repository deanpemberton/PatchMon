name: Remediation feature validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417
        with:
          go-version-file: server-source-code/go.mod
          cache: false
      - name: Check formatting
        run: |
          gofmt -w server-source-code/internal/remediation/*.go \
            server-source-code/internal/handler/remediation.go \
            server-source-code/internal/handler/patching.go \
            server-source-code/internal/queue/severity_remediation.go \
            server-source-code/internal/queue/auto_patch_worker.go \
            server-source-code/internal/queue/jobs.go \
            server-source-code/internal/queue/server.go \
            server-source-code/internal/server/router.go \
            agent-source-code/cmd/patchmon-agent/commands/verified_patch*.go \
            agent-source-code/cmd/patchmon-agent/commands/serve.go
          if ! git diff --quiet; then
            git diff --no-color
            exit 1
          fi
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - name: Test advisory adapter (synthetic, offline)
        run: python3 -m unittest discover -s tools/remediation -p 'test_*.py' -v
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: patchmon_test
          POSTGRES_PASSWORD: patchmon_test
          POSTGRES_DB: patchmon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U patchmon_test -d patchmon_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version-file: package.json
          cache: npm
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417
        with:
          go-version-file: server-source-code/go.mod
          cache-dependency-path: |
            server-source-code/go.sum
            agent-source-code/go.sum
      - name: Build frontend
        run: |
          npm ci
          npm run build --workspace=frontend
          mkdir -p server-source-code/cmd/server/static/frontend
          cp -r frontend/dist server-source-code/cmd/server/static/frontend/
      - name: Test and build server
        working-directory: server-source-code
        env:
          PATCHMON_TEST_DATABASE_URL: postgresql://patchmon_test:patchmon_test@localhost:5432/patchmon_test?sslmode=disable
        run: |
          go test ./internal/remediation ./internal/queue ./internal/handler
          CGO_ENABLED=0 go build -buildvcs=false -trimpath -o ../patchmon-server ./cmd/server
      - name: Test and build agent
        working-directory: agent-source-code
        run: |
          go test ./cmd/patchmon-agent/commands
          CGO_ENABLED=0 go build -buildvcs=false -trimpath -o ../patchmon-agent ./cmd/patchmon-agent
      - name: Record build provenance
        run: |
          git rev-parse HEAD > BUILD_COMMIT
          sha256sum patchmon-server patchmon-agent BUILD_COMMIT > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: remediation-test-binaries
          path: |
            patchmon-server
            patchmon-agent
            BUILD_COMMIT
            SHA256SUMS
          retention-days: 7
